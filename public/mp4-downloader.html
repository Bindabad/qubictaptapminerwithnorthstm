<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP4 Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 500px; width: 100%; }
        h1 { color: #333; margin-bottom: 30px; text-align: center; font-size: 28px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; color: #555; margin-bottom: 8px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 10px; }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3); }
        button:active { transform: translateY(0); }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 MP4 Downloader</h1>
        <div class="input-group">
            <label for="url1">Video URL 1</label>
            <input type="url" id="url1" placeholder="https://example.com/video1.mp4">
            <button onclick="download(1)">Download Video 1</button>
        </div>
        <div class="input-group">
            <label for="url2">Video URL 2</label>
            <input type="url" id="url2" placeholder="https://example.com/video2.mp4">
            <button onclick="download(2)">Download Video 2</button>
        </div>
        <div class="input-group">
            <label for="url3">Video URL 3</label>
            <input type="url" id="url3" placeholder="https://example.com/video3.mp4">
            <button onclick="download(3)">Download Video 3</button>
        </div>
        <div class="status" id="status"></div>
    </div>
    <script>
        async function download(num) {
            const url = document.getElementById('url' + num).value;
            const status = document.getElementById('status');

            if (!url) {
                status.className = 'status error';
                status.textContent = 'Please enter a valid URL';
                return;
            }

            try {
                status.className = 'status success';
                status.textContent = 'Downloading...';

                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = 'video' + num + '.mp4';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);

                status.className = 'status success';
                status.textContent = 'Download started!';
            } catch (error) {
                status.className = 'status error';
                status.textContent = 'Error downloading video. Check URL or CORS policy.';
            }
        }
    </script>
</body>
</html>
